baseURL = 'https://zuo.vercel.app/'
languageCode = 'en-us'
title = "Zuo's personal blog"
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
env = "production"
title = "Zuo's personal blog"
description = "Your site description"
keywords = ["Blog", "Portfolio", "PaperMod"]
author = "Zuo"
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true

[params.homeInfoParams]
Title = "Welcome 👋"
Content = """
Zuo made a site

[Check out the Svelte App](/app)
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/MrMegaMango"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/mrmightymango/"

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false

[module]
[[module.mounts]]
source = "../svelte/build"
target = "static/app"
