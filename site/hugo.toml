baseURL = 'https://zuo.vercel.app/'
languageCode = 'en-us'
title = "Zuo's personal blog"
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

ignoreLogs = ['warning-partial-superfluous-prefix']

# Analytics (uncomment and add your tracking IDs)
# googleAnalytics = "G-XXXXXXXXXX"
# [params.analytics]
# google = "G-XXXXXXXXXX"

# Adding main menu
[[menu.main]]
identifier = "resume"
name = "Resume"
url = "/resume"
weight = 10

# Adding archive menu entry
[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts"
weight = 20

# Adding interactive app menu entry
[[menu.main]]
identifier = "app"
name = "Interactive App ↗"
url = "https://zuo-svelte-one.vercel.app/"
weight = 30


[params]
env = "production"
title = "Zuo Wang"
description = "Staff AI Backend Engineer specializing in scalable systems, performance optimization, and zero-to-production solutions. 6+ years experience at Tesla, Atlassian, and Samaya AI."
keywords = ["AI Infrastructure", "Software Engineering", "Performance Optimization", "Golang", "Python", "Tesla", "Samaya AI", "Machine Learning", "Backend", "Zuo Wang"]
author = "Zuo Wang"
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false

# SEO and Performance
images = ["/images/profile.jpg"]
mainSections = ["posts"]
disableFingerprinting = false

# Custom assets
[params.assets]
disableHLJS = false
disableFingerprinting = false
customCSS = ["css/extended/custom.css"]
customJS = ["js/custom.js"]

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true

[params.homeInfoParams]
Title = "Hey, I'm Zuo 👋"
Content = """
**Staff AI Infrastructure Engineer** with 6+ years building scalable systems that power the future.

Currently architecting AI platforms at **Samaya AI** that serve BlackRock, Citi, and Point72. Previously scaled Tesla's battery manufacturing systems and built security infrastructure at Atlassian.

🚀 **80% performance improvements** 

💰 **$10M+ business impact** 

🏗️ **Zero-to-production specialist**

Passionate about turning complex problems into elegant solutions.
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/MrMegaMango"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/mrmightymango/"

[params.cover]
hidden = false
hiddenInList = false
hiddenInSingle = false

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true


